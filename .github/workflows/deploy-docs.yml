name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build HTML
        run: |
          make html

      - name: Include book URL aliases
        run: python -c "import shutil; shutil.copytree('physical-ai-book', '_build/html/physical-ai-book', dirs_exist_ok=True)"

      - name: Checkout internw0-page
        uses: actions/checkout@v4
        with:
          repository: InternRobotics/internw0-page
          path: internw0-page

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: internw0-page/pnpm-lock.yaml

      - name: Build internw0 static site
        working-directory: internw0-page
        env:
          NEXT_PUBLIC_BASE_PATH: /internw0
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Include internw0 subpage
        run: python -c "import shutil; shutil.copytree('internw0-page/out', '_build/html/internw0', dirs_exist_ok=True)"

      - name: Include RoboAtom subpage
        run: python -c "import shutil; shutil.copytree('RoboAtom', '_build/html/RoboAtom', dirs_exist_ok=True)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Docs
        id: deployment
        uses: actions/deploy-pages@v4
